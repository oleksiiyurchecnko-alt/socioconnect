name: CI/CD

on:
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx run-many -t lint --all

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx nx run-many -t test --all --skip-nx-cache

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E admin
        run: npx nx run e2e-admin:e2e

      - name: E2E main
        run: npx nx run e2e-main:e2e

  build:
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx nx run-many -t build --projects=admin,main --configuration=production

      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist/apps/admin/browser

      - name: Upload main artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-dist
          path: dist/apps/main/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-dist

      - name: Download main artifact
        uses: actions/download-artifact@v4
        with:
          name: main-dist
          path: main-dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set deploy target
        id: deploy
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "bucket=${{ secrets.S3_BUCKET_PROD }}" >> $GITHUB_OUTPUT
            echo "cloudfront=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "bucket=${{ secrets.S3_BUCKET_DEV }}" >> $GITHUB_OUTPUT
            echo "cloudfront=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to S3
        run: |
          aws s3 sync admin-dist s3://${{ steps.deploy.outputs.bucket }}/admin/ --delete
          aws s3 sync main-dist s3://${{ steps.deploy.outputs.bucket }}/main/ --delete

      - name: Invalidate CloudFront
        if: steps.deploy.outputs.cloudfront != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.deploy.outputs.cloudfront }} --paths "/admin/*" "/main/*"
