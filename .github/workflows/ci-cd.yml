name: CI/CD

on:
  push:
    branches: [main, development]

jobs:
  set-shas:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set NX_BASE and NX_HEAD
        id: shas
        run: |
          if [ "${{ github.event.before }}" != "" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            git fetch origin main development 2>/dev/null || true
            BASE=$(git merge-base HEAD origin/main 2>/dev/null || echo "HEAD~1")
            echo "base=${BASE}" >> $GITHUB_OUTPUT
            echo "head=HEAD" >> $GITHUB_OUTPUT
          fi

  affected-apps:
    runs-on: ubuntu-latest
    needs: set-shas
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      has_apps: ${{ steps.apps.outputs.has_apps }}
    steps:
      - uses: ./.github/actions/setup-node-npm
        with:
          fetch-depth: 0

      - name: Get affected deployable apps
        id: apps
        run: |
          APPS=$(npx nx show projects --affected --type app --projects=admin,main --base=${{ needs.set-shas.outputs.base }} --head=${{ needs.set-shas.outputs.head }} --json)
          echo "apps=${APPS}" >> $GITHUB_OUTPUT
          if [ "${APPS}" = "[]" ]; then
            echo "has_apps=false" >> $GITHUB_OUTPUT
          else
            echo "has_apps=true" >> $GITHUB_OUTPUT
          fi

  lint:
    runs-on: ubuntu-latest
    needs: set-shas
    steps:
      - uses: ./.github/actions/setup-node-npm
        with:
          fetch-depth: 0

      - name: Lint
        run: npx nx affected -t lint --base=${{ needs.set-shas.outputs.base }} --head=${{ needs.set-shas.outputs.head }} --parallel=3 --outputStyle=static

  test:
    runs-on: ubuntu-latest
    needs: set-shas
    steps:
      - uses: ./.github/actions/setup-node-npm
        with:
          fetch-depth: 0

      - name: Unit tests
        run: npx nx affected -t test --base=${{ needs.set-shas.outputs.base }} --head=${{ needs.set-shas.outputs.head }} --skip-nx-cache --parallel=3 --outputStyle=static

  e2e:
    runs-on: ubuntu-latest
    needs: [set-shas, lint, test]
    steps:
      - uses: ./.github/actions/setup-node-npm
        with:
          fetch-depth: 0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx nx affected -t e2e --base=${{ needs.set-shas.outputs.base }} --head=${{ needs.set-shas.outputs.head }} --parallel=2 --outputStyle=static

  build:
    runs-on: ubuntu-latest
    needs: [affected-apps, e2e]
    if: needs.affected-apps.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.affected-apps.outputs.apps) }}
    steps:
      - uses: ./.github/actions/setup-node-npm
        with:
          fetch-depth: 0

      - name: Build ${{ matrix.app }}
        run: npx nx run ${{ matrix.app }}:build:production --outputStyle=static

      - name: Upload ${{ matrix.app }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: dist/apps/${{ matrix.app }}/browser

  deploy:
    runs-on: ubuntu-latest
    needs: [affected-apps, build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && needs.affected-apps.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.affected-apps.outputs.apps) }}
    steps:
      - name: Download ${{ matrix.app }} artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: ${{ matrix.app }}-dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set deploy target
        id: deploy
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "bucket=${{ secrets.S3_BUCKET_PROD }}" >> $GITHUB_OUTPUT
            echo "cloudfront=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "bucket=${{ secrets.S3_BUCKET_DEV }}" >> $GITHUB_OUTPUT
            echo "cloudfront=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy ${{ matrix.app }} to S3
        run: aws s3 sync ${{ matrix.app }}-dist s3://${{ steps.deploy.outputs.bucket }}/${{ matrix.app }}/ --delete

      - name: Invalidate ${{ matrix.app }} CloudFront path
        if: steps.deploy.outputs.cloudfront != ''
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.deploy.outputs.cloudfront }} --paths "/${{ matrix.app }}/*"
